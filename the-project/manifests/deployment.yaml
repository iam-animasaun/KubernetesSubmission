apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: todo-app-cache
      containers:
        - name: todo-app
          image: todo-app:4.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: todo-app-config
          ports:
            - name: http
              containerPort: 4000
          volumeMounts:
            - name: cache
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
