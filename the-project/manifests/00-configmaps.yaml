apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: project
data:
  PORT: "4000"
  CACHE_DIR: /data
  IMAGE_URL: https://picsum.photos/1200
  IMAGE_MAX_AGE_SECONDS: "600"
  MAX_TODO_LENGTH: "140"
  ENABLE_SHUTDOWN: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=5000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-backend-config
  namespace: project
data:
  PORT: "4001"
  MAX_TODO_LENGTH: "140"
  DB_HOST: todo-db
  DB_PORT: "5432"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-db-config
  namespace: project
data:
  POSTGRES_DB: todos
